name: Publish Docker image

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example 2.7.72 or v2.7.72
        required: true
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: imgzcq/mdesk
  DOCKERHUB_USERNAME: imgzcq

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_LATEST_INPUT: ${{ github.event.inputs.publish_latest }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_TAG}" ]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          release_tag="${RELEASE_TAG}"
          if [[ "${release_tag}" != v* ]]; then
            release_tag="v${release_tag}"
          fi

          version="${release_tag#v}"
          publish_latest=false
          if [ "${EVENT_NAME}" = "release" ] || [ "${PUBLISH_LATEST_INPUT}" = "true" ]; then
            publish_latest=true
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            assets="$(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name')"

            if grep -qx "MDesk-linux-amd64" <<< "${assets}" &&
               grep -qx "MDesk-linux-arm64" <<< "${assets}"; then
              break
            fi

            if [ "${attempt}" -eq 60 ]; then
              echo "Timed out waiting for Linux release assets." >&2
              exit 1
            fi

            echo "Waiting for release assets (${attempt}/60)..."
            sleep 10
          done

          mkdir -p app/bin
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "MDesk-linux-amd64" \
            --pattern "MDesk-linux-arm64" \
            --dir app/bin \
            --clobber

          mv app/bin/MDesk-linux-amd64 app/bin/MDesk-amd64
          mv app/bin/MDesk-linux-arm64 app/bin/MDesk-arm64
          chmod 0755 app/bin/MDesk-amd64 app/bin/MDesk-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest == 'true' }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
